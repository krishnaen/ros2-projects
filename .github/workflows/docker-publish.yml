name: Build and Push ROS 2 to GHCR

on:
  push:
    branches: [ "main" ]

# Grant the cloud runner permissions to read code and write packages
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    # 1. Log into GHCR using GitHub's automatic built-in token
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}       # Automatically grabs your GitHub username
        password: ${{ secrets.GITHUB_TOKEN }} # Automatically generated temporary token

    # 2. Extract metadata (tags, labels) to format the image naming cleanly
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/my-py-pkg

    # 3. Build and push the image layer to GHCR
    - name: Build and push Python Package
      uses: docker/build-push-action@v6
      with:
        context: ./src/my_py_pkg
        file: ./src/my_py_pkg/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

