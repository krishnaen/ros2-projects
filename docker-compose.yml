version: '3.8'

services:
  # Service 1: Your Python Package
  python-app:
    build:
      context: ./src/my_py_pkg    # Points directly to the package folder
      dockerfile: Dockerfile
    image: yourusername/my-py-pkg:latest
    container_name: ros2_py_node
    network_mode: host
    pid: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0

